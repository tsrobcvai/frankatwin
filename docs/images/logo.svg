<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="FrankaTwin: a panda lying across a simulation | reality split, with a wireframe robot arm on the sim side and a real one on the other">
  <defs>
    <linearGradient id="simbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="realbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <clipPath id="clipL"><rect x="0" y="0" width="320" height="320"/></clipPath>
    <clipPath id="clipR"><rect x="320" y="0" width="320" height="320"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- backgrounds -->
  <rect x="0" y="0" width="320" height="320" fill="url(#simbg)"/>
  <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1"><line x1="0" y1="0" x2="0" y2="320"/><line x1="32" y1="0" x2="32" y2="320"/><line x1="64" y1="0" x2="64" y2="320"/><line x1="96" y1="0" x2="96" y2="320"/><line x1="128" y1="0" x2="128" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="192" y1="0" x2="192" y2="320"/><line x1="224" y1="0" x2="224" y2="320"/><line x1="256" y1="0" x2="256" y2="320"/><line x1="288" y1="0" x2="288" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/><line x1="0" y1="0" x2="320" y2="0"/><line x1="0" y1="32" x2="320" y2="32"/><line x1="0" y1="64" x2="320" y2="64"/><line x1="0" y1="96" x2="320" y2="96"/><line x1="0" y1="128" x2="320" y2="128"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="192" x2="320" y2="192"/><line x1="0" y1="224" x2="320" y2="224"/><line x1="0" y1="256" x2="320" y2="256"/><line x1="0" y1="288" x2="320" y2="288"/><line x1="0" y1="320" x2="320" y2="320"/></g>
  <rect x="320" y="0" width="320" height="320" fill="url(#realbg)"/>
  <rect x="320" y="230" width="320" height="90" fill="#e7d8c3"/>
  <line x1="320" y1="230" x2="640" y2="230" stroke="#c9b28f" stroke-width="2"/>
  <line x1="0" y1="230" x2="320" y2="230" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>

  <!-- labels -->
  <text x="18" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc">SIM</text>
  <text x="622" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#b45309">REAL</text>

  <!-- robots -->
  
    <g filter="url(#glow)">
      <rect x="72" y="212" width="76" height="18" rx="4" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 110 212 L 96 142 L 152 96 L 194 112" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 194 112 l 14 -8 M 194 112 l 14 8" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
      <circle cx="110" cy="212" r="9" fill="#0b1220" stroke="#7dd3fc" stroke-width="3"/><circle cx="96" cy="142" r="9" fill="#0b1220" stroke="#7dd3fc" stroke-width="3"/><circle cx="152" cy="96" r="9" fill="#0b1220" stroke="#7dd3fc" stroke-width="3"/>
    </g>
    
  
    <g>
      <rect x="490" y="210" width="80" height="20" rx="5" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
      <path d="M 530 212 L 544 142 L 488 96 L 446 112" fill="none" stroke="#6b7280" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 530 212 L 544 142 L 488 96 L 446 112" fill="none" stroke="#f9fafb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 446 112 l -14 -9 M 446 112 l -14 9" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
      <circle cx="530" cy="212" r="10" fill="#111827"/><circle cx="544" cy="142" r="10" fill="#111827"/><circle cx="488" cy="96" r="10" fill="#111827"/>
    </g>
    

  <!-- sim -> real transfer arc -->
  <path d="M 200 104 Q 320 34 440 104" fill="none" stroke="url(#arc)" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M 440 104 l -12 -8 M 440 104 l -13 5" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- panda: wireframe on the sim side, solid on the real side -->
  <g clip-path="url(#clipL)">
    <!-- body -->
    <ellipse cx="320" cy="270" rx="122" ry="46" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5"/>
    <!-- forearms stretched forward, chin resting on them; one on each side of the seam -->
    <ellipse cx="258" cy="292" rx="54" ry="19" transform="rotate(-10 258 292)" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <ellipse cx="382" cy="292" rx="54" ry="19" transform="rotate(10 382 292)" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- ears -->
    <circle cx="262" cy="148" r="27" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <circle cx="378" cy="148" r="27" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- head -->
    <circle cx="320" cy="200" r="72" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5"/>
    <!-- eye patches -->
    <ellipse cx="290" cy="198" rx="21" ry="27" transform="rotate(-18 290 198)" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <ellipse cx="350" cy="198" rx="21" ry="27" transform="rotate(18 350 198)" fill="#0b1220" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- eyes -->
    <circle cx="293" cy="201" r="9" fill="#0b1220" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="347" cy="201" r="9" fill="#0b1220" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="294" cy="202" r="5.5" fill="#7dd3fc"/>
    <circle cx="346" cy="202" r="5.5" fill="#7dd3fc"/>
    <circle cx="296.5" cy="199.5" r="2" fill="#e0f2fe"/>
    <circle cx="348.5" cy="199.5" r="2" fill="#e0f2fe"/>
    <!-- nose + mouth + blush -->
    <ellipse cx="320" cy="224" rx="9" ry="6.5" fill="#7dd3fc"/>
    <path d="M 306 236 q 14 11 28 0" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="266" cy="226" r="8" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
    <circle cx="374" cy="226" r="8" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
    </g>
  <g clip-path="url(#clipR)">
    <!-- body -->
    <ellipse cx="320" cy="270" rx="122" ry="46" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <!-- forearms stretched forward, chin resting on them; one on each side of the seam -->
    <ellipse cx="258" cy="292" rx="54" ry="19" transform="rotate(-10 258 292)" fill="#111827" stroke="#111827" stroke-width="3"/>
    <ellipse cx="382" cy="292" rx="54" ry="19" transform="rotate(10 382 292)" fill="#111827" stroke="#111827" stroke-width="3"/>
    <!-- ears -->
    <circle cx="262" cy="148" r="27" fill="#111827" stroke="#111827" stroke-width="3"/>
    <circle cx="378" cy="148" r="27" fill="#111827" stroke="#111827" stroke-width="3"/>
    <!-- head -->
    <circle cx="320" cy="200" r="72" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <!-- eye patches -->
    <ellipse cx="290" cy="198" rx="21" ry="27" transform="rotate(-18 290 198)" fill="#111827" stroke="#111827" stroke-width="3"/>
    <ellipse cx="350" cy="198" rx="21" ry="27" transform="rotate(18 350 198)" fill="#111827" stroke="#111827" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="293" cy="201" r="9" fill="#ffffff"/>
    <circle cx="347" cy="201" r="9" fill="#ffffff"/>
    <circle cx="294" cy="202" r="5.5" fill="#111827"/>
    <circle cx="346" cy="202" r="5.5" fill="#111827"/>
    <circle cx="296.5" cy="199.5" r="2" fill="#ffffff"/>
    <circle cx="348.5" cy="199.5" r="2" fill="#ffffff"/>
    <!-- nose + mouth + blush -->
    <ellipse cx="320" cy="224" rx="9" ry="6.5" fill="#111827"/>
    <path d="M 306 236 q 14 11 28 0" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="266" cy="226" r="8" fill="#fca5a5" opacity="0.7"/>
    <circle cx="374" cy="226" r="8" fill="#fca5a5" opacity="0.7"/>
    </g>

  <!-- seam -->
  <rect x="318" y="0" width="4" height="320" fill="url(#seam)" opacity="0.9"/>
</svg>
