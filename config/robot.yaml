# panda_control runtime config.
#
# The NUC daemon reads this to know where the robot lives and what to default
# gains to. The PC client reads the same file to know where the NUC daemon
# listens.
#
# Override path via the PANDA_CONFIG environment variable:
#   PANDA_CONFIG=/path/to/local.yaml python examples/cart_impedance.py

network:
  # Hostname or IP of the NUC running panda_control.daemon. The PC client
  # connects to tcp://nuc_host:cmd_port (REQ/REP) and tcp://nuc_host:state_port
  # (SUB).
  nuc_host: "172.16.0.1"
  cmd_port: 5555
  state_port: 5556
  # PC-side cache depth (number of state frames buffered locally for get_state).
  state_cache: 256

robot:
  # FCI IP (visible only from the NUC).
  ip: "172.16.0.2"
  # Default home / init joint configuration in radians (7 floats).
  init_q: [0.0, -0.785398, 0.0, -2.356194, 0.0, 1.570796, 0.785398]

control:
  # 1 kHz fixed; documented for clarity.
  frequency_hz: 1000
  # Default Cartesian impedance gains. These are seeded into shm on osc_shm
  # startup and can be overridden at runtime via robot.set_gains(...).
  kp_pos: 200.0      # N/m
  kp_ori: 20.0       # Nm/rad
  kd_pos: null       # null -> 2 * sqrt(kp_pos)
  kd_ori: null       # null -> 2 * sqrt(kp_ori)
  # Per-tick error clamp inside osc_shm. Acts as a hard safety: |e_pos|_inf
  # larger than this aborts the control loop; same for ||e_o||.
  error_delta_pos: 0.05    # m
  error_delta_rot: 0.30    # rad

# libfranka collision-reflex thresholds (passed to setCollisionBehavior at
# osc_shm startup; daemon restart applies a change, no rebuild needed once the
# osc_shm binary supports --collision-torque/--collision-cartesian).
#
# Why 100 (not libfranka's low defaults): the task-impedance controller's OWN
# push is bounded by kp * error_delta = kp_pos*0.05 (~25 N at kp_pos=500) and
# kp_ori*0.30 (~9 Nm at kp_ori=30). The contact reaction during peg-hole
# insertion therefore reaches ~25 N -- above a 20 N threshold -- which fires
# "cartesian_reflex" (red light, controller aborts). 100 mirrors the deoxys
# stack, which never reflexed during insertion. Lower these (e.g. 40 / 50) if
# you want a tighter crash guard with some margin over the ~25 N working force;
# raising them trades collision safety for letting the controller push freely
# (its force is still capped by error_delta_pos above).
collision:
  torque_threshold: 100.0      # Nm,    per joint  (fills setCollisionBehavior torque arrays)
  cartesian_threshold: 100.0   # N/Nm,  per axis   (fills the Cartesian force arrays)

paths:
  # Path to the panda_control build directory (where osc_shm and move_to live).
  # Resolved relative to the repo root unless absolute.
  build_dir: "build"
  # POSIX shm name (must start with '/'). Daemon and osc_shm must agree.
  shm_name: "/panda_osc"

reset:
  # Default speed factor for move_to --q. Range (0, 0.5].
  joint_speed_factor: 0.2
  # Default duration (s) for move_to --pose.
  pose_duration: 5.0

# Reserved for future gripper integration. Not used by the current daemon.
gripper:
  enabled: false

# End-effector payload for libfranka gravity/inertia compensation.
# osc_shm calls robot.setLoad(mass, com, inertia) at startup when mass > 0;
# mass = 0 disables it (uses the Desk-configured load). Restart the daemon after
# changing these -- no recompile needed (only osc_shm.cpp needed the one-time
# rebuild that added setLoad support).
#
# Current values = ZED Mini camera + mount estimate.
#   - Bare ZED Mini: 0.0629 kg (Stereolabs spec).
#   - The MOUNTED load (camera + bracket + connector) is heavier; the no-cam vs
#     with-cam run showed ~6 mm static z sag at home -> ~0.3 kg effective
#     (k_z * sag / g = 500 * 0.006 / 9.81). BEST: weigh the full camera+bracket
#     assembly and put that here.
#   - com: vector from the FLANGE frame origin to the load COM [m] (flange z is
#     the tool axis). Estimate from the bracket; mass dominates the gravity
#     force, com mainly shifts the joint-torque split.
#   - inertia: 3x3 about the COM, row-major [kg m^2]. MUST be a physically valid
#     (positive-definite) tensor -- libfranka REJECTS an all-zero matrix with
#     "Set Load command rejected: invalid argument!".  Use a small positive
#     diagonal; the exact value barely affects behaviour (gravity comp uses only
#     mass + com; inertia just feeds the model's Coriolis/mass terms).  Estimate
#     as a box: I_ii ~ (1/12)*m*(sum of the other two side-lengths^2).  For a
#     ~0.3 kg ZED Mini+bracket the diagonal is O(1e-4) kg m^2.
# After setting, re-run six_dof and check the with-cam z sag is largely gone.
load:
  # Calibrated 2026-05-31 (ZED Mini + bracket). Bracketed the true effective
  # payload from the symmetric z signature: m_comp=0 sagged -27mm vs nocam,
  # m_comp=0.3 lifted +27mm -> linear zero-crossing ~0.15kg (7-phase estimates
  # 0.147-0.158, very consistent). 0.3 was ~2x too large (over-compensating).
  mass: 0.15
  # Simplified to [0, 0, z]: camera assumed roughly on the tool axis, so only the
  # along-axis offset is kept (flange +Z points out along the tool axis). A wrong
  # LATERAL (x/y) com injects a bogus moment arm -- worse than zero -- so refine
  # x/y only if the rotation phases (4-6) show a directional residual. mass=0.15
  # is com-independent (gravity force depends on mass only), so this does NOT
  # affect the z calibration -- only the rotation-phase joint-torque split.
  com: [0.0, 0.0, 0.05]
  # Small positive diagonal (must NOT be all-zero). Refine from box dims if desired.
  inertia: [3.0e-4, 0.0, 0.0, 0.0, 3.0e-4, 0.0, 0.0, 0.0, 3.0e-4]
