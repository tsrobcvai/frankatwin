[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panda_control"
version = "0.1.0"
description = "Python wrappers around the panda_control libfranka 1 kHz controller."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "panda_control authors" }]
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "pyzmq>=25",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["panda_control*"]
