[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frankatwin"
version = "0.1.0"
description = "1 kHz Cartesian impedance controller for Franka FR3/Panda with a sim-to-real system-ID pipeline (IsaacLab)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Tao Sun", email = "tao.sun@mail.mcgill.ca" }]
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "pyzmq>=25",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
# For scripts/compare_sim_real.py and friends (PC-side analysis).
analysis = [
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["frankatwin*"]
